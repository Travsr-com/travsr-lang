[package]
name = "travsr-lang-objc"
description = "Travsr Phase B — Objective-C semantic analysis via libclang"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# scip 0.7.x requires Rust 1.81.
rust-version = "1.81"

[[bin]]
name = "travsr-objc-index-emitter"
path = "src/main.rs"

[dependencies]
travsr-plugin-sdk       = { workspace = true }
travsr-core             = { workspace = true }
travsr-lang-scip-reader = { workspace = true }
scip                    = "0.7"
protobuf                = "3"
anyhow                  = { workspace = true }
tempfile                = { workspace = true }
tracing                 = { workspace = true }
tracing-subscriber      = { workspace = true }

# libclang FFI — macOS only (Linux support is optional; Phase B returns false on non-macOS).
[target.'cfg(target_os = "macos")'.dependencies]
clang-sys  = { version = "1", features = ["clang_6_0"] }
serde_json = { workspace = true }
