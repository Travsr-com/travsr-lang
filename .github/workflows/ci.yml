name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust (check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # travsr-core is patched from a sibling repo (../travsr) because Language::Dart
      # and Language::Swift are not yet published to crates.io. Cargo resolves the
      # [patch.crates-io] at workspace root which requires the sibling to be present.
      #
      # actions/checkout@v4 blocks paths outside $GITHUB_WORKSPACE, so we check out
      # into _travsr (inside the workspace) and symlink it to ../travsr so Cargo's
      # [patch.crates-io] paths resolve without touching Cargo.toml.
      - uses: actions/checkout@v4
        with:
          repository: Travsr-com/travsr
          ref: master
          path: _travsr

      - name: Symlink _travsr as ../travsr for Cargo patch resolution
        run: ln -s "$GITHUB_WORKSPACE/_travsr" "$GITHUB_WORKSPACE/../travsr"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: check
        run: cargo check --workspace

      - name: test
        run: cargo test --workspace

  objc-macos:
    name: objc emitter (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Travsr-com/travsr
          ref: master
          path: _travsr

      - name: Symlink _travsr as ../travsr for Cargo patch resolution
        run: ln -s "$GITHUB_WORKSPACE/_travsr" "$GITHUB_WORKSPACE/../travsr"

      - uses: dtolnay/rust-toolchain@stable

      - name: Locate libclang and set runtime paths
        run: |
          CLANG_BIN=$(xcrun --find clang)
          CLANG_LIB=$(dirname "$CLANG_BIN")/../lib
          LIBCLANG_DIR=$(realpath "$CLANG_LIB")
          echo "LIBCLANG_PATH=${LIBCLANG_DIR}" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=${LIBCLANG_DIR}" >> "$GITHUB_ENV"
          # clang-sys bakes an absolute -L search path to the active Xcode's lib
          # dir into the cached clang-sys build script output. When the macos-latest
          # runner image bumps Xcode, that cached path (e.g. Xcode_16.4) disappears
          # and linking travsr-lang-objectivec fails with "library 'clang' not found".
          # Key the Rust cache on the Xcode build so an image bump invalidates it.
          echo "XCODE_BUILD=$(xcodebuild -version 2>/dev/null | tr '\n' '-' | tr -d ' ')" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: objc-${{ env.XCODE_BUILD }}

      - name: build
        run: cargo build --release -p travsr-lang-objc

      - name: test (symbol unit tests)
        run: cargo test -p travsr-lang-objc

      - name: smoke test — binary starts and exits cleanly on EOF
        run: |
          ./target/release/travsr-lang-objectivec < /dev/null
          echo "binary exited OK"

  swift-macos:
    name: swift emitter (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: build
        working-directory: packages/swift-index-emitter
        run: swift build -c release

      - name: smoke test
        working-directory: packages/swift-index-emitter
        run: |
          mkdir -p /tmp/swift_smoke/Sources
          cat > /tmp/swift_smoke/Sources/Hello.swift <<'EOF'
          struct Greeter {
              func greet() { print("hello") }
          }
          EOF
          .build/release/swift-index-emitter /tmp/swift_smoke /tmp/swift_smoke_out.json
          grep -q '"version"' /tmp/swift_smoke_out.json

  swift-linux:
    name: swift emitter (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"

      - name: build
        working-directory: packages/swift-index-emitter
        run: swift build -c release

      - name: smoke test
        working-directory: packages/swift-index-emitter
        run: |
          mkdir -p /tmp/swift_smoke/Sources
          cat > /tmp/swift_smoke/Sources/Hello.swift <<'EOF'
          struct Greeter {
              func greet() { print("hello") }
          }
          EOF
          .build/release/swift-index-emitter /tmp/swift_smoke /tmp/swift_smoke_out.json
          grep -q '"version"' /tmp/swift_smoke_out.json

  dart:
    name: dart emitter (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: pub get
        working-directory: packages/dart-scip-emitter
        run: dart pub get

      - name: analyze
        working-directory: packages/dart-scip-emitter
        run: dart analyze bin/emit.dart

      - name: smoke test
        working-directory: packages/dart-scip-emitter
        run: |
          mkdir -p /tmp/dart_smoke/lib
          cat > /tmp/dart_smoke/lib/hello.dart <<'EOF'
          class Greeter {
            String greet(String name) => 'Hello, $name!';
          }
          EOF
          cat > /tmp/dart_smoke/pubspec.yaml <<'EOF'
          name: dart_smoke
          environment:
            sdk: ">=3.0.0 <4.0.0"
          EOF
          dart run bin/emit.dart /tmp/dart_smoke /tmp/dart_smoke_out.json
          grep -q '"version"' /tmp/dart_smoke_out.json
