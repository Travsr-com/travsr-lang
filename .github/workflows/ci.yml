  dart:
    name: dart emitter (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: pub get
        working-directory: packages/dart-scip-emitter
        run: dart pub get

      - name: analyze
        working-directory: packages/dart-scip-emitter
        run: dart analyze bin/emit.dart

      - name: smoke test
        working-directory: packages/dart-scip-emitter
        run: |
          mkdir -p /tmp/dart_smoke/lib
          cat > /tmp/dart_smoke/lib/hello.dart <<'EOF'
          class Greeter {
            String greet(String name) => 'Hello, $name!';
          }
          EOF
          cat > /tmp/dart_smoke/pubspec.yaml <<'EOF'
          name: dart_smoke
          environment:
            sdk: ">=3.0.0 <4.0.0"
          EOF
          dart run bin/emit.dart /tmp/dart_smoke /tmp/dart_smoke_out.json
          grep -q '"version"' /tmp/dart_smoke_out.json

      # Same gap as the swift jobs: the --version handshake was never exercised.
      # `dart run` prints its own build chatter first, so take the last line.
      - name: version handshake
        working-directory: packages/dart-scip-emitter
        run: |
          out=$(dart run bin/emit.dart --version | tail -n 1)
          expected=$(sed -n 's/^version = "\(.*\)"/\1/p' ../../Cargo.toml | head -1)
          echo "reported: $out / expected: dart-index-emitter $expected"
          test "$out" = "dart-index-emitter $expected"

      # release.yml ships the AOT binary, not the JIT entry point, and nothing
      # on a PR compiled it. The compile is the slowest step in this job (the
      # analyzer package is large), and it is the only thing that proves the
      # artifact users actually get still builds and answers --version.
      - name: compile AOT and re-check the handshake
        working-directory: packages/dart-scip-emitter
        run: |
          dart compile exe bin/emit.dart -o bin/emit-native
          out=$(./bin/emit-native --version)
          expected=$(sed -n 's/^version = "\(.*\)"/\1/p' ../../Cargo.toml | head -1)
          echo "reported: $out / expected: dart-index-emitter $expected"
          test "$out" = "dart-index-emitter $expected"
          # #299 E1: an AOT binary resolves the SDK from Platform.resolvedExecutable,
          # which is the binary itself, so the analyzer looks for lib/_internal next
          # to it and dies with PathNotFoundException. The daemon passes DART_SDK for
          # exactly this reason; the smoke test has to do the same or it is not
          # exercising how the shipped binary is actually invoked.
          # readlink -f first: `dart` on PATH is commonly a symlink into the real
          # SDK, and dirname twice on the link gives the wrong root.
          DART_SDK="$(dirname "$(dirname "$(readlink -f "$(command -v dart)")")")"
          test -f "$DART_SDK/version" && test -d "$DART_SDK/lib" || {
            echo "DART_SDK does not look like an SDK root: $DART_SDK"; exit 1; }
          DART_SDK="$DART_SDK" ./bin/emit-native /tmp/dart_smoke /tmp/dart_smoke_aot.json
          grep -q '"version"' /tmp/dart_smoke_aot.json
