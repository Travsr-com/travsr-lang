name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege by default: nothing here publishes, comments, or writes to
# the repo, so read access to the contents is all any job needs. A job that
# later needs more must ask for it explicitly.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust (check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # travsr-core is patched from a sibling repo (../travsr) because Language::Dart
      # and Language::Swift are not yet published to crates.io. Cargo resolves the
      # [patch.crates-io] at workspace root which requires the sibling to be present.
      #
      # actions/checkout@v4 blocks paths outside $GITHUB_WORKSPACE, so we check out
      # into _travsr (inside the workspace) and symlink it to ../travsr so Cargo's
      # [patch.crates-io] paths resolve without touching Cargo.toml.
      # Deliberately floating: this repo builds against travsr's master, so a
      # pin here would silently stop testing the pair that actually ships
      # together. The cost is real and accepted: a push to Travsr-com/travsr
      # can turn this workflow red without a change here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Travsr-com/travsr
          ref: master
          path: _travsr

      - name: Symlink _travsr as ../travsr for Cargo patch resolution
        run: ln -s "$GITHUB_WORKSPACE/_travsr" "$GITHUB_WORKSPACE/../travsr"

      # The emitter version literals are hand maintained and compared at runtime
      # against the Rust crate version, and nothing enforced the pair: the dart
      # pubspec had already drifted to 0.1.0. A release that bumps Cargo.toml and
      # forgets one of these makes every freshly built emitter report a skew that
      # is not real, which is cry wolf on the feature's first outing.
      - name: emitter version literals match the crate version
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          swift=$(sed -n 's/^let emitterVersion = "\(.*\)"/\1/p' \
            packages/swift-index-emitter/Sources/main.swift)
          dart=$(sed -n "s/^const emitterVersion = '\(.*\)';/\1/p" \
            packages/dart-scip-emitter/bin/emit.dart)
          pubspec=$(sed -n 's/^version: \(.*\)/\1/p' packages/dart-scip-emitter/pubspec.yaml)
          echo "crate=$crate swift=$swift dart=$dart pubspec=$pubspec"
          fail=0
          for pair in "swift-index-emitter:$swift" "dart-scip-emitter:$dart" "pubspec.yaml:$pubspec"; do
            if [ "${pair#*:}" != "$crate" ]; then
              echo "MISMATCH: ${pair%%:*} says '${pair#*:}', Cargo.toml workspace version is '$crate'"
              fail=1
            fi
          done
          exit $fail

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2025-11-13
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: check
        run: cargo check --workspace

      - name: test
        run: cargo test --workspace

  # travsr#588: the release workflow now ships x86_64-pc-windows-msvc wrappers.
  # Nothing built them on Windows before, so a Windows-only compile break would
  # only have surfaced during a tag, after the release was already half-published.
  # Every wrapper except objc (libclang/xcrun, macOS-only) is built here.
  windows:
    name: rust (Windows build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Deliberately floating: this repo builds against travsr's master, so a
      # pin here would silently stop testing the pair that actually ships
      # together. The cost is real and accepted: a push to Travsr-com/travsr
      # can turn this workflow red without a change here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Travsr-com/travsr
          ref: master
          path: _travsr

      # Same trick as the release workflow rather than the `ln -s` the Linux job
      # uses: a Git Bash symlink on Windows needs Developer Mode and silently
      # degrades to a copy without it.
      - name: Rewrite Cargo.toml patch paths for CI
        shell: bash
        run: sed -i.bak 's|path = "\.\./travsr/|path = "_travsr/|g' Cargo.toml && rm -f Cargo.toml.bak

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2025-11-13
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-msvc

      # Debug, not --release: this job exists to catch compile breaks, which are
      # profile-independent in practice, and a release build of twelve binaries
      # on every PR is a poor trade for that. The release profile itself is only
      # exercised at tag time, which is a known and accepted gap.
      - name: build every released wrapper
        shell: bash
        run: |
          for bin in $(grep -vE '^[[:space:]]*(#|$)' .github/wrapper-bins.txt); do
            cargo build --bin "$bin" --target x86_64-pc-windows-msvc
          done

      # The packaging rules are the actual cross-repo contract: travsr's
      # installer requests `<bin>-<target>.exe` and its `.exe.sha256` sidecar,
      # and a mistake in that naming used to be undiscoverable until a tag had
      # already published the wrong names. Run the real packaging script and
      # assert the names it produces.
      - name: rehearse release packaging
        shell: bash
        run: |
          bash .github/scripts/package-wrappers.sh x86_64-pc-windows-msvc debug

          fail=0
          for bin in $(grep -vE '^[[:space:]]*(#|$)' .github/wrapper-bins.txt); do
            for f in "dist/${bin}-x86_64-pc-windows-msvc.exe" \
                     "dist/${bin}-x86_64-pc-windows-msvc.exe.sha256"; do
              if [ ! -s "$f" ]; then
                echo "MISSING or empty: $f"
                fail=1
              fi
            done
          done

          # An extensionless asset means the .exe rule regressed. Windows would
          # then publish names travsr's installer never asks for, which is the
          # travsr#588 failure mode in the other direction.
          if ls dist/ | grep -vE '\.exe(\.sha256)?$' | grep -q .; then
            echo "unexpected extensionless asset(s):"
            ls dist/ | grep -vE '\.exe(\.sha256)?$'
            fail=1
          fi

          exit $fail

      - name: test
        shell: bash
        run: cargo test --workspace --exclude travsr-lang-objc

  objc-macos:
    name: objc emitter (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Deliberately floating: this repo builds against travsr's master, so a
      # pin here would silently stop testing the pair that actually ships
      # together. The cost is real and accepted: a push to Travsr-com/travsr
      # can turn this workflow red without a change here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Travsr-com/travsr
          ref: master
          path: _travsr

      - name: Symlink _travsr as ../travsr for Cargo patch resolution
        run: ln -s "$GITHUB_WORKSPACE/_travsr" "$GITHUB_WORKSPACE/../travsr"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2025-11-13

      - name: Locate libclang and set runtime path
        run: |
          # travsr-lang#17: the emitter dlopens libclang at runtime (clang-sys
          # `runtime` feature) rather than link-binding it, so it needs only
          # LIBCLANG_PATH to locate the dylib. No DYLD_LIBRARY_PATH (there is no
          # link-time dependency to satisfy) and no Xcode-keyed cache (clang-sys
          # no longer bakes an absolute -L path, so an image bump is harmless).
          CLANG_BIN=$(xcrun --find clang)
          CLANG_LIB=$(dirname "$CLANG_BIN")/../lib
          LIBCLANG_DIR=$(realpath "$CLANG_LIB")
          echo "LIBCLANG_PATH=${LIBCLANG_DIR}" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: objc

      - name: build
        run: cargo build --release -p travsr-lang-objc

      - name: test (unit + libclang runtime load path)
        run: cargo test -p travsr-lang-objc

      - name: smoke test (binary starts and exits cleanly on EOF)
        run: |
          ./target/release/travsr-lang-objectivec < /dev/null
          echo "binary exited OK"

  swift-macos:
    name: swift emitter (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: build
        working-directory: packages/swift-index-emitter
        run: swift build -c release

      # The reference COUNT does not move when a resolution change retargets a
      # symbol, so the smoke test below cannot see one. These unit tests pin the
      # resolution rules themselves.
      - name: test
        working-directory: packages/swift-index-emitter
        run: swift test

      # The headline feature of this pair is the --version handshake, and
      # nothing exercised it: an emitter that cannot answer the flag makes the
      # sidecar warn on every single run. Assert the exact line shape the Rust
      # side parses, "<name> <version>", and that the version is the crate's.
      - name: version handshake
        working-directory: packages/swift-index-emitter
        run: |
          out=$(.build/release/swift-index-emitter --version | tail -n 1)
          expected=$(sed -n 's/^version = "\(.*\)"/\1/p' ../../Cargo.toml | head -1)
          echo "reported: $out / expected: swift-index-emitter $expected"
          test "$out" = "swift-index-emitter $expected"

      - name: smoke test
        working-directory: packages/swift-index-emitter
        run: |
          mkdir -p /tmp/swift_smoke/Sources
          cat > /tmp/swift_smoke/Sources/Hello.swift <<'EOF'
          struct Config {}
          struct Greeter {
              let config: Config
              func greet() -> Config { config }
          }
          struct Stack<Config> {
              func push(_ x: Config) {}
          }
          extension Stack {
              func peek() -> Config? { nil }
          }
          struct Payload {}
          protocol Shape {}
          struct Box {}
          enum Event { case fired(Payload) }
          struct Widget {
              let combo: Box & Shape
              func cast(_ any: Any) -> Box? { any as? Box }
          }
          protocol Runner {}
          extension Runner {
              static func launch() -> Int { 0 }
              static func chain() -> Int { launch() }
          }
          struct Job: Runner {}
          class Base { class func baseStatic() {} }
          class Derived: Base {}
          func inheritedCalls() -> Int {
              Derived.baseStatic()
              return Job.launch()
          }
          func genericCall<T: Runner>(_ t: T.Type) -> Int { T.launch() }
          EOF
          .build/release/swift-index-emitter /tmp/swift_smoke /tmp/swift_smoke_out.json
          grep -q '"version"' /tmp/swift_smoke_out.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open('/tmp/swift_smoke_out.json'))
          refs = [r for doc in d['documents'] for r in doc['references']]
          errs = []
          # travsr#830: a type used only in annotation / return position must be
          # emitted as a reference, not just tracked. `Config` appears only in the
          # field annotation and the return type here, so a reference to it proves
          # type-position capture is on. Checks the references array specifically,
          # since `swift::Config` is also present as a definition.
          config = [r for r in refs if r['symbol'] == 'swift::Config']
          if not config:
              errs.append('no reference to swift::Config (type-position capture off)')
          # A type-position use is an occurrence, not a call: with is_call unset
          # the wrapper defaults it to true and every annotation becomes a
          # ref/call edge, so get_callers(Config) would list declaration sites.
          if any(r.get('is_call', True) for r in config):
              errs.append('type-position reference to swift::Config is flagged is_call')
          # `Config` as the generic parameter of Stack shadows the real type. The
          # two valid references are the annotation and the return type in Greeter.
          # `struct Stack<Config>` binds Config as a generic parameter, and the
          # `extension Stack` uses it in a return type without restating it, so a
          # third or fourth swift::Config reference means a generic parameter leaked
          # (from the declaration or, the extension case, from the extension body).
          if len(config) != 2:
              errs.append('expected 2 swift::Config refs, got %d (generic parameter leaked?)' % len(config))
          # travsr#830 recall beyond simple annotations. Each type below is used
          # only in a position the emitter must descend into, and each must be a
          # type-position occurrence (is_call false), never a call edge.
          def occ(sym):
              return [r for r in refs if r['symbol'] == sym]
          # enum associated value: `case fired(Payload)`
          payload = occ('swift::Payload')
          if not payload:
              errs.append('enum associated-value type swift::Payload not referenced')
          # protocol composition member: `Box & Shape`
          if not occ('swift::Shape'):
              errs.append('composition member swift::Shape not referenced')
          # `Box` is used in the composition, the return type and the `as?` cast
          box = occ('swift::Box')
          if len(box) < 2:
              errs.append('swift::Box undercounted (composition/return/as-cast): %d' % len(box))
          # A static/type-method call is written on the receiver but may be
          # declared on a supertype or protocol extension. The emitter keyed the
          # symbol on the receiver, so every inherited call named a symbol no
          # definition carried and was dropped: 33% of all references on
          # swift-argument-parser, and `references parseAsRoot` found none of its
          # 11 caller files. Each case below must key on the DECLARING type.
          if not occ('swift::Runner.launch'):
              errs.append('inherited protocol-extension call not keyed on the declaring type')
          if occ('swift::Job.launch'):
              errs.append('call keyed on the receiver (swift::Job.launch) instead of the declarer')
          if not occ('swift::Base.baseStatic'):
              errs.append('inherited superclass call not keyed on the declaring type')
          if occ('swift::Derived.baseStatic'):
              errs.append('call keyed on the subclass instead of the declarer')
          # A bare call inside the declaring extension is implicit-self static
          # dispatch, not a top-level function.
          if occ('swift::launch'):
              errs.append('bare call in the declaring extension emitted as a free function')
          # A generic parameter names no real type: it must resolve through its
          # constraint, and never be emitted as a type reference of its own.
          if occ('swift::T'):
              errs.append('generic parameter emitted as a real type reference')
          for r in payload + occ('swift::Shape') + box:
              if r.get('is_call', True):
                  errs.append('type-position ref %s flagged is_call' % r['symbol'])
          if errs:
              print('\n'.join(errs))
              print(json.dumps(refs, indent=2))
              sys.exit(1)
          PY

